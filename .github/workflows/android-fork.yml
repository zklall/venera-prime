name: Build fork Android APK
run-name: Build fork Android APK

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: [.github/workflows/android-fork.yml]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          architecture: x64
          cache: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Reuse the fork's development key for subsequent builds.
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/fork-signing
          key: android-fork-signing-v1-${{ github.repository_id }}

      - name: Prepare fork signing
        env:
          FORK_KEY_DIR: ${{ runner.temp }}/fork-signing
        run: |
          set -euo pipefail
          mkdir -p "$FORK_KEY_DIR"
          if [ ! -f "$FORK_KEY_DIR/fork.jks" ]; then
            keytool -genkeypair -noprompt -keystore "$FORK_KEY_DIR/fork.jks" \
              -storetype JKS -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Venera Prime Fork, OU=Development, O=zklall"
          fi
          cat > android/key.properties <<EOF
          storeFile=$FORK_KEY_DIR/fork.jks
          storePassword=android
          keyAlias=androiddebugkey
          keyPassword=android
          EOF

      - name: Give the fork a separate Android identity
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path('android/app/build.gradle')
          old = ': "com.github.wgh136.venera.prime"'
          text = gradle.read_text()
          assert text.count(old) == 1
          gradle.write_text(text.replace(old, ': "com.github.zklall.venera.prime"'))

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          old = 'android:label="Venera Prime"'
          text = manifest.read_text()
          assert text.count(old) == 1
          manifest.write_text(text.replace(old, 'android:label="Venera Prime Fork"'))
          PY

      - name: Set up Rust toolchain
        run: rustup show

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build release APKs
        run: flutter build apk --release

      - name: Verify APKs and record build details
        run: |
          set -euo pipefail
          apksigner_path="$(printf '%s\n' "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          aapt_path="$(dirname "$apksigner_path")/aapt"
          output_dir=build/app/outputs/apk/release
          {
            echo "Source commit: $GITHUB_SHA"
            echo 'Application: Venera Prime Fork'
            echo 'Package: com.github.zklall.venera.prime'
            echo 'Signed with an independent fork development key.'
            echo 'Install alongside Venera Prime; app data is separate.'
            for apk in "$output_dir"/*.apk; do
              echo
              basename "$apk"
              "$apksigner_path" verify --print-certs "$apk"
              "$aapt_path" dump badging "$apk" | sed -n '1p'
              sha256sum "$apk"
            done
          } | tee "$output_dir/build-info.txt"
          cat "$output_dir/build-info.txt" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: android-fork-apks
          path: |
            build/app/outputs/apk/release/*.apk
            build/app/outputs/apk/release/build-info.txt
          if-no-files-found: error
          retention-days: 30
